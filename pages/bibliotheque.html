<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bibliothèque — Entrepreneur & IA</title>
    <meta name="description" content="Recueil de livres recommandés pour les entrepreneurs." />
    <link rel="icon" type="image/svg+xml" href="../img/favicon-ai.svg" />
    <link rel="stylesheet" href="../assets/styles.css" />
  </head>
  <body data-page="bibliotheque">
    <a class="skipLink" href="#contenu">Aller au contenu</a>

    <header class="siteHeader" data-surface="page">
      <nav class="nav" aria-label="Menu principal">
        <a class="brand" href="../index.html" aria-label="Entrepreneur & IA (Accueil)">
          <img
            class="brandMark"
            src="../img/founder_hacks_compass_refined_v4_1024.png"
            alt=""
            width="34"
            height="34"
            loading="eager"
          />
          <span class="brandText">Entrepreneur & IA</span>
        </a>

        <button class="navToggle" type="button" aria-expanded="false" aria-controls="navPanel">
          <span class="navToggleIcon" aria-hidden="true"></span>
          <span class="srOnly">Ouvrir le menu</span>
        </button>

        <div class="navPanel" id="navPanel">
          <a class="navLink" href="../index.html">Accueil</a>
          <a class="navLink" href="assistant-ia.html">Assistant IA</a>
          <a class="navLink" href="conseils.html">Conseils</a>
          <a class="navLink isActive" href="bibliotheque.html">Bibliothèque</a>
          <a class="navLink" href="a-propos.html">À propos</a>
        </div>
      </nav>

	      <section class="pageHero" id="contenu">
	        <div class="container">
	          <p class="pill" data-i18n="bibliotheque.pill">Le coin lecture</p>
	          <h1 data-i18n="bibliotheque.title">Bibliothèque</h1>
	          <p class="lead" data-i18n="bibliotheque.lead">Un recueil de livres recommandés pour entrepreneurs, triables par intention.</p>
	        </div>
	      </section>
    </header>

    <main class="main">
	      <section class="section" style="padding-top: 0;">
	        <div class="container">
	          <div class="toolbar">
	            <label class="srOnly" for="bookSearch" data-i18n="bibliotheque.searchLabel">Rechercher un livre</label>
	            <input
	              id="bookSearch"
	              class="searchInput"
	              type="search"
	              placeholder="Rechercher un livre (ex: pricing, produit…)"
	              data-i18n-key="bibliotheque.searchPlaceholder"
	              data-i18n-attr="placeholder"
	            />
	            <div
	              class="filters"
	              id="tagFilters"
	              role="group"
	              aria-label="Tags"
	              data-i18n-key="bibliotheque.filtersLabel"
	              data-i18n-attr="aria-label"
	            ></div>
	            <p class="muted tiny" id="bookCount" aria-live="polite"></p>
	          </div>

          <div
            class="bookGrid"
            id="bookGrid"
            aria-label="Liste des livres"
            data-i18n-key="bibliotheque.listLabel"
            data-i18n-attr="aria-label"
          ></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      <div class="container footerRow">
        <p class="muted">© <span data-year></span> Entrepreneur & IA</p>
        <a class="footerLegal" href="mentions-legales.html">Mentions légales</a>
      </div>
    </footer>

    <script src="../assets/main.js" defer></script>
  </body>
</html>
